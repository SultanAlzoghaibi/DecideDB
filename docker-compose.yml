# Local Postgres for development: `docker compose up -d`.
# On a fresh volume, every file in db/migrations/ runs once, in name order.
# To re-run them from scratch: `docker compose down -v && docker compose up -d`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jevdb
      POSTGRES_PASSWORD: jevdb # dev only, never use in production
      POSTGRES_DB: jevdb
    ports:
      # Host port 5433 by default so it never clashes with a local Postgres on 5432.
      # Running two checkouts at once? Set DECIDEDB_PG_PORT (and the port in DATABASE_URL).
      - "${DECIDEDB_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

# Named volume: data survives `docker compose down` and restarts.
# Only `docker compose down -v` (or `bun run db:reset` in web/) deletes it.
volumes:
  pgdata:
