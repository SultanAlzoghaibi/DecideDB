# Local Postgres for development: `docker compose up -d`.
# On a fresh volume, every file in db/migrations/ runs once, in name order.
# To re-run them from scratch: `docker compose down -v && docker compose up -d`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jevdb
      POSTGRES_PASSWORD: jevdb # dev only, never use in production
      POSTGRES_DB: jevdb
    ports:
      - "5433:5432" # host 5433 so it never clashes with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
